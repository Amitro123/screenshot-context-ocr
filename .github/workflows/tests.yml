name: Regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-heb
      - run: python -m unittest discover -s tests -v
        env:
          OCR_NATIVE_CLIPBOARD_TESTS: '1'
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/model-data.tests.ps1
